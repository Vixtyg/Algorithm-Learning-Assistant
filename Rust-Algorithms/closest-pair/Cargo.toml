[package]
name = "closest-pair"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
name = "closest_pair"
path = "src/main.rs"

[dependencies]
getrandom = "0.4.2"
rand = "0.10.1"
wasm = "0.0.0"
wasm-bindgen = "0.2.122"
[target.wasm32-unknown-unknown.dependencies]
getrandom_v2 = { version = "0.2", features = ["js"], package = "getrandom" }
getrandom    = { version = "0.4", features = ["wasm_js"] }
